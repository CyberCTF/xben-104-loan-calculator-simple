# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: xben-104-loan-calculator-simple
services:
  db:
    build:
      context: ../../build/db
    image: isoloom/xben-104-loan-calculator-simple-db
    platform: linux/amd64
    hostname: db
    networks:
      lab:
        ipv4_address: 10.61.147.10
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    labels:
      isoloom.service.mysql: tcp:3306
    restart: unless-stopped
  db-routes:
    image: alpine:3.20
    network_mode: service:db
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
  ssti-loan-calculator:
    build:
      context: ../../build/ssti-loan-calculator
    image: isoloom/xben-104-loan-calculator-simple-ssti-loan-calculator
    platform: linux/amd64
    hostname: ssti-loan-calculator
    networks:
      lab:
        ipv4_address: 10.61.147.20
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
    restart: unless-stopped
  ssti-loan-calculator-routes:
    image: alpine:3.20
    network_mode: service:ssti-loan-calculator
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      ssti-loan-calculator:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      ssti-loan-calculator:
        condition: service_healthy
      ssti-loan-calculator-routes:
        condition: service_healthy
  isoloom-check-db:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/db.sh:/isoloom/run.sh:ro
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      ssti-loan-calculator:
        condition: service_healthy
      ssti-loan-calculator-routes:
        condition: service_healthy
  isoloom-check-ssti-loan-calculator:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/ssti-loan-calculator.sh:/isoloom/run.sh:ro
    network_mode: service:ssti-loan-calculator
    depends_on:
      db:
        condition: service_healthy
      db-routes:
        condition: service_healthy
      ssti-loan-calculator:
        condition: service_healthy
      ssti-loan-calculator-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.61.147.0/24
        gateway: 10.61.147.1
volumes:
  isoloom-probe-amd64: {}
