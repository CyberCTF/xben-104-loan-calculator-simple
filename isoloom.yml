# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-104-24 Loan Calculator - Simple (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask loan calculator backed by MySQL that builds its JSON answers with Jinja templates.
# The benchmark folder benchmarks/XBEN-104-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/ssti-loan-calculator/app/, built by its own Dockerfiles; the overlay in build/ssti-loan-calculator/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-104-loan-calculator-simple

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.147.0/24, internet: false }

machines:
  db:
    networks: { lab: 10 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 1024 }
    docker:
      build: build/db

  ssti-loan-calculator:
    networks: { lab: 20 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/ssti-loan-calculator
      init: [ctf/flag.sh]

checks:
  - name: the Loan Calculator - Simple page answers
    http: http://ssti-loan-calculator:80/login
    wait: 180
  - name: a wrong login is refused
    script: checks/probe.sh
    wait: 60

message: |
  Loan Calculator - Simple answers at http://localhost:{{ machines.ssti-loan-calculator.services.0.publish }}/.
  JSON answers built from Jinja templates. Log in, then look at how the loan figures come back.
